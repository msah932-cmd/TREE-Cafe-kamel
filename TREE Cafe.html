<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#556B2F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TREE Cafe">
<title>TREE Cafe</title>
<style>
:root{--olive:#556B2F;--deep:#3C4E32;--forest:#263D2B;--sage:#87977A;--pale:#EDF0E6;--ivory:#FDFBF7;--wood:#C9B79C;--gold:#B8995A;--ink:#2b2f26;--muted:#6b7262;--nav:66px;--top:60px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Cairo","Noto Kufi Arabic","Segoe UI",Tahoma,Arial,sans-serif;background:var(--ivory);color:var(--ink);overflow:hidden;font-size:16px}
button,input,textarea{font-family:inherit;font-size:16px;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--sage);outline-offset:2px}
button,a,.cat,.tile{touch-action:manipulation}

/* splash */
#splash{position:fixed;inset:0;z-index:100;background:#225748;display:flex;align-items:center;justify-content:center;transition:opacity .6s,visibility .6s}
#splash img{width:min(78vw,78vh,420px);height:auto;border-radius:6px}
#splash.hide{opacity:0;visibility:hidden}

/* header: logo at far left always */
.top{position:fixed;top:0;left:0;right:0;z-index:20;height:calc(var(--top) + env(safe-area-inset-top));padding:env(safe-area-inset-top) max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));background:linear-gradient(180deg,var(--olive),var(--deep));color:#fff;display:flex;direction:ltr;align-items:center;justify-content:space-between;box-shadow:0 3px 14px rgba(38,61,43,.3)}
.top .logo{height:44px;width:44px;border-radius:9px;object-fit:contain;display:block;box-shadow:0 0 0 1.5px rgba(255,255,255,.35)}
.top .ttl{font-weight:800;font-size:18px;letter-spacing:1px}
.lang{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.55);color:#fff;border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer;direction:ltr;font-weight:600;transition:.2s}
.lang:hover{background:rgba(255,255,255,.28)}

/* screens */
#app{position:fixed;top:calc(var(--top) + env(safe-area-inset-top));bottom:calc(var(--nav) + env(safe-area-inset-bottom));left:0;right:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.screen{display:none;padding:18px max(14px,env(safe-area-inset-left)) 28px;max-width:1100px;margin:auto}
.screen.on{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* bottom nav */
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:linear-gradient(180deg,var(--deep),var(--forest));display:flex;justify-content:center;box-shadow:0 -3px 14px rgba(38,61,43,.25)}
nav button{flex:1;max-width:200px;background:none;border:0;color:rgba(255,255,255,.62);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12.5px;cursor:pointer;position:relative;transition:color .2s}
nav button:hover{color:#fff}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:#fff;font-weight:700}
nav button.on::before{content:"";position:absolute;top:0;width:34px;height:3px;border-radius:0 0 4px 4px;background:#cfe0a8}

/* common */
h2.sec{font-size:19px;color:var(--deep);margin:24px 2px 12px;font-weight:800}
.card{background:#fff;border:1px solid var(--pale);border-radius:18px;padding:16px;box-shadow:0 2px 10px rgba(60,78,50,.07);margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 18px;font-weight:700;cursor:pointer;min-height:48px;transition:transform .12s,box-shadow .2s,background .2s;text-align:center}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(60,78,50,.18)}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--olive);color:#fff}
.btn.s{background:var(--pale);color:var(--deep)}
.btn.o{background:#fff;border:1.5px solid var(--olive);color:var(--olive)}
.btn.wa{background:#25D366;color:#fff;width:100%}
.btn svg{width:20px;height:20px;flex:0 0 auto}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 150px}
.muted{color:var(--muted);font-size:14.5px;line-height:1.8}

/* hero */
.hero{position:relative;overflow:hidden;background:radial-gradient(circle at 85% 15%,rgba(255,255,255,.14) 0 90px,transparent 91px),radial-gradient(circle at 10% 90%,rgba(255,255,255,.09) 0 120px,transparent 121px),linear-gradient(155deg,var(--forest),var(--olive));color:#fff;border-radius:24px;padding:28px 20px;margin-bottom:14px;box-shadow:0 8px 24px rgba(38,61,43,.25)}
.hero h1{font-size:clamp(22px,4.6vw,34px);line-height:1.5;margin-bottom:10px;font-weight:800}
.hero p{opacity:.93;line-height:1.9;font-size:clamp(14.5px,2.4vw,17px);margin-bottom:18px;max-width:560px}
.hero .btn{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.45)}
.hero .btn.main{background:#fff;color:var(--deep);border:0}

/* home tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:#fff;border:1px solid var(--pale);border-radius:16px;padding:16px 12px;text-align:center;cursor:pointer;transition:.2s;box-shadow:0 2px 8px rgba(60,78,50,.06);color:var(--deep);font-weight:700;line-height:1.5}
.tile:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(60,78,50,.15);border-color:var(--sage)}
.tile small{display:block;color:var(--muted);font-weight:500;margin-top:4px}

/* menu */
.search{width:100%;padding:14px 18px;border:1.5px solid var(--pale);border-radius:14px;background:#fff;margin-bottom:12px;box-shadow:0 2px 8px rgba(60,78,50,.05)}
.search:focus,.f input:focus,.f textarea:focus{outline:none;border-color:var(--olive);box-shadow:0 0 0 3px rgba(85,107,47,.18)}
.catsw{position:sticky;top:-18px;z-index:5;margin:0 -14px 12px;padding:6px 0 4px;background:linear-gradient(180deg,var(--ivory) 80%,rgba(253,251,247,0))}
.cats{display:flex;gap:10px;overflow-x:auto;padding:4px 14px 8px;cursor:grab;scrollbar-width:none;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.cats::-webkit-scrollbar{display:none}
.cats.drag{cursor:grabbing;scroll-snap-type:none}
.cat{flex:0 0 auto;scroll-snap-align:center;border:1.5px solid var(--olive);background:#fff;color:var(--olive);padding:10px 20px;border-radius:999px;cursor:pointer;white-space:nowrap;font-size:15px;font-weight:600;user-select:none;transition:.2s}
.cat:hover{background:var(--pale)}
.cat.on{background:var(--olive);color:#fff;box-shadow:0 4px 12px rgba(85,107,47,.35)}
.warn{display:flex;gap:10px;align-items:flex-start;background:#fbf5e4;border:1px solid #ecdcae;color:#6b5a1f;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.7;margin-bottom:14px}
.warn svg{width:20px;height:20px;stroke:#9b7f2a;fill:none;stroke-width:2;flex:0 0 auto;margin-top:2px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.grid .card{margin:0;transition:.2s}
.grid .card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(60,78,50,.13)}
.item h3{font-size:16px;line-height:1.5;margin-bottom:8px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--pale);color:var(--deep);border-radius:10px;padding:6px 12px;font-size:14px;display:inline-flex;gap:6px;align-items:baseline}
.chip small{color:var(--muted);font-size:12.5px}
.chip b{font-size:15.5px}
.gh{grid-column:1/-1;font-size:17px;color:var(--olive);font-weight:800;margin:14px 2px 0;padding-bottom:6px;border-bottom:2px solid var(--pale)}
.empty{text-align:center;padding:30px 12px;color:var(--muted)}

/* form */
.formw{max-width:560px;margin:auto}
.f{margin-bottom:14px}
.f label{display:block;font-weight:700;font-size:14.5px;margin-bottom:6px;color:var(--deep)}
.f input,.f textarea{width:100%;padding:13px 14px;border:1.5px solid var(--pale);border-radius:12px;background:#fff;transition:.2s}
.f textarea{min-height:90px;resize:vertical}
.err{color:#b3261e;font-size:13px;margin-top:5px;display:none}
.f.bad input{border-color:#b3261e}.f.bad .err{display:block}
.note{background:var(--pale);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.8;color:var(--deep);margin-top:12px}

/* faq */
.q{border:1px solid var(--pale);border-radius:14px;margin-bottom:10px;background:#fff;overflow:hidden;box-shadow:0 2px 8px rgba(60,78,50,.05)}
.q button{width:100%;background:none;border:0;padding:15px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;color:var(--deep);text-align:start;cursor:pointer;font-size:15.5px;line-height:1.6}
.q button:hover{background:#f7f9f2}
.q .a{display:none;padding:0 16px 16px;color:var(--muted);line-height:1.9;font-size:14.5px}
.q.on .a{display:block}
.q .chev{transition:transform .2s;flex:0 0 auto}
.q.on .chev{transform:rotate(180deg)}
.faqg{display:grid;gap:0 12px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));align-items:start}
.hours{display:flex;gap:12px;align-items:flex-start}
.hours>svg{width:24px;height:24px;stroke:var(--olive);fill:none;stroke-width:1.8;flex:0 0 auto;margin-top:2px}
.lsw{display:flex;gap:10px}.lsw button{flex:1}.lsw .on{background:var(--olive);color:#fff}
.two{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.two .card{margin:0}


/* reviews */
.revg{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.rev{margin:0;transition:.2s}
.rev:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(60,78,50,.13)}
.rh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(145deg,var(--sage),var(--olive));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;flex:0 0 auto}
.rh b{display:block;font-size:15px;line-height:1.3}
.rh small{color:var(--muted);font-size:12.5px}
.rec{margin-inline-start:auto;background:var(--pale);color:var(--deep);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.rev p{line-height:1.9;font-size:15px;margin-bottom:10px;text-align:start}
.tg{display:flex;flex-wrap:wrap;gap:6px}
.tg span{background:#f4f6ee;border:1px solid var(--pale);color:var(--deep);border-radius:8px;padding:3px 9px;font-size:12.5px}
.revnote{color:var(--muted);font-size:13px;margin:0 2px 12px;line-height:1.7}

/* follow footer (every page) */
.follow{margin-top:30px;padding:20px 16px;border-radius:20px;background:linear-gradient(155deg,var(--forest),var(--deep));color:#fff;text-align:center}
.follow b{display:block;margin-bottom:12px;font-size:16px}
.follow .row{justify-content:center}
.follow .btn{flex:0 1 190px;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.4)}
.follow .btn:hover{background:#fff;color:var(--deep)}
.follow svg{width:22px;height:22px}
@media (min-width:700px){nav{left:50%;right:auto;transform:translateX(-50%);width:min(620px,92vw);bottom:12px;height:var(--nav);padding-bottom:0;border-radius:22px;overflow:hidden}#app{bottom:calc(var(--nav) + 24px)}.screen{padding-bottom:40px}}
@media (max-width:360px){.cat{padding:9px 14px;font-size:14px}.top .ttl{font-size:16px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="splash"><img id="splashLogo" alt="TREE Cafe"></div>

<header class="top">
  <img class="logo" id="hdrLogo" alt="TREE Cafe">
  <span class="ttl">TREE Cafe</span>
  <button class="lang" id="langBtn" aria-label="Language">العربية | English</button>
</header>

<main id="app">

  <section class="screen on" id="s-home">
    <div class="hero">
      <h1 data-i="heroH"></h1>
      <p data-i="heroP"></p>
      <div class="row">
        <button class="btn main" data-go="menu" data-i="exploreMenu"></button>
        <button class="btn" data-go="reserve" data-i="reserveNow"></button>
        <a class="btn" data-map target="_blank" rel="noopener" data-i="ourLoc"></a>
      </div>
    </div>
    <div class="card"><h2 class="sec" style="margin-top:0" data-i="aboutT"></h2><p class="muted" data-i="aboutP"></p></div>
    <h2 class="sec" data-i="popCats"></h2>
    <div class="tiles" id="tiles"></div>
    <div class="warn" style="margin-top:14px"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/></svg><span data-i="priceNote"></span></div>
    <h2 class="sec" data-i="revT"></h2>
    <p class="revnote" data-i="revSub"></p>
    <div class="revg" id="revHome"></div>
    <div class="card hours" style="margin-top:14px"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><div><b data-i="hoursT"></b><p class="muted" data-i="hoursP"></p></div></div>
    <div class="row">
      <a class="btn p" href="tel:+201090103828"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.500a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg><span data-i="callUs"></span></a>
      <a class="btn wa" style="flex:1 1 150px" target="_blank" rel="noopener" href="https://wa.me/201090103828"><svg class="waic" viewBox="0 0 24 24" fill="currentColor"></svg><span data-i="wa"></span></a>
    </div>
    <h2 class="sec" data-i="faqT"></h2>
    <div class="faqg" id="faqPrev"></div>
    <button class="btn s" style="width:100%" data-go="more" data-scroll="faqBox" data-i="allFaq"></button>
    <div class="follow"></div>
  </section>

  <section class="screen" id="s-menu">
    <input class="search" id="search" data-iph="search" type="search" autocomplete="off">
    <div class="catsw"><div class="cats" id="cats"></div></div>
    <div class="warn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/></svg><span data-i="priceNote"></span></div>
    <div class="grid" id="menuList"></div>
    <div class="follow"></div>
  </section>

  <section class="screen" id="s-reserve">
    <div class="formw">
    <h2 class="sec" style="margin-top:4px" data-i="resT"></h2>
    <form id="form" class="card" novalidate>
      <div class="f" id="f-name"><label for="name" data-i="fName"></label><input id="name" autocomplete="name"><div class="err" data-i="eName"></div></div>
      <div class="f" id="f-phone"><label for="phone" data-i="fPhone"></label><input id="phone" type="tel" inputmode="tel" autocomplete="tel"><div class="err" data-i="ePhone"></div></div>
      <div class="f" id="f-date"><label for="date" data-i="fDate"></label><input id="date" type="date"><div class="err" data-i="eDate"></div></div>
      <div class="f" id="f-time"><label for="time" data-i="fTime"></label><input id="time" type="time"><div class="err" data-i="eTime"></div></div>
      <div class="f" id="f-guests"><label for="guests" data-i="fGuests"></label><input id="guests" type="number" min="1" max="50" inputmode="numeric"><div class="err" data-i="eGuests"></div></div>
      <div class="f"><label for="notes" data-i="fNotes"></label><textarea id="notes"></textarea></div>
      <button type="submit" class="btn wa"><svg class="waic" viewBox="0 0 24 24" fill="currentColor"></svg><span data-i="sendWa"></span><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      <div class="note" data-i="resNote"></div>
    </form>
    <div class="follow"></div>
    </div>
  </section>

  <section class="screen" id="s-more">
    <div class="two">
      <div class="card"><h2 class="sec" style="margin-top:0" data-i="aboutT"></h2><p class="muted" data-i="aboutP"></p></div>
      <div class="card hours"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><div><b data-i="hoursT"></b><p class="muted" data-i="hoursP"></p></div></div>
      <div class="card"><h2 class="sec" style="margin-top:0" data-i="contactT"></h2>
        <div class="row">
          <a class="btn p" href="tel:+201090103828" data-i="callUs"></a>
          <a class="btn s" target="_blank" rel="noopener" href="https://wa.me/201090103828" data-i="wa"></a>
          <a class="btn o" data-map target="_blank" rel="noopener" data-i="ourLoc"></a>
        </div>
        <p class="muted" style="margin-top:10px;direction:ltr;text-align:start">+20 10 90103828</p>
      </div>
    </div>
    <h2 class="sec" data-i="revT"></h2>
    <p class="revnote" data-i="revSub"></p>
    <div class="revg" id="revMore"></div>
    <div class="row" style="margin-top:12px">
      <a class="btn p" id="revFbBtn" target="_blank" rel="noopener" data-i="revFb"></a>
      <a class="btn o" data-map target="_blank" rel="noopener" data-i="revBtn"></a>
    </div>
    <h2 class="sec" id="faqBox" data-i="faqT"></h2>
    <div class="faqg" id="faqAll"></div>
    <div class="card" style="margin-top:12px"><h2 class="sec" style="margin-top:0" data-i="langT"></h2>
      <div class="lsw"><button class="btn s" data-l="ar">العربية</button><button class="btn s" data-l="en">English</button></div></div>
    <div class="follow"></div>
  </section>
</main>

<nav id="nav">
  <button data-go="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span data-i="nHome"></span></button>
  <button data-go="menu"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h4"/></svg><span data-i="nMenu"></span></button>
  <button data-go="reserve"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg><span data-i="nRes"></span></button>
  <button data-go="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg><span data-i="nMore"></span></button>

const ITEMS=[];
CATS.forEach(c=>c.raw.trim().split('\n').forEach(line=>{
  const [ar,en,pr]=line.split('|').map(s=>s.trim());
  let p;
  if(pr.startsWith('r')){const [a,b]=pr.slice(1).split('-').map(Number);p={range:[a,b]};}
  else if(pr.includes('~')){p={list:pr.split(';').map(x=>{const [la,le,v]=x.split('~');return {la,le,v:+v};})};}
  else p={list:[{la:'',le:'',v:+pr}]};
  ITEMS.push({c:c.id,ar,en,p});
}));

function renderReviews(){
  const html=REVIEWS.map(r=>`<div class="card rev"><div class="rh"><div class="av">${r.n[0]}</div><div><b><bdi>${r.n}</bdi></b><small>${lang==='ar'?r.d.ar:r.d.en}</small></div><span class="rec">${t('recommends')}</span></div><p dir="rtl" lang="ar">${r.t}</p>${r.g.length?`<div class="tg">${r.g.map(x=>`<span>${lang==='ar'?x:TAGS[x]}</span>`).join('')}</div>`:''}</div>`).join('');
  ['#revHome','#revMore'].forEach(id=>{const e=$(id);if(e)e.innerHTML=html;});
  const fb=$('#revFbBtn');if(fb)fb.href=FACEBOOK_URL;
}

let lang=(function(){try{return localStorage.getItem('tc_lang')||'ar'}catch(e){return'ar'}})(), cat='all', q='';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const t=k=>T[lang][k], L=o=>lang==='ar'?o.ar:o.en;
const num=v=>(Number.isInteger(v)?v:v.toFixed(2));

const FBIC='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 8h3V4h-3a4 4 0 0 0-4 4v2H7v4h3v8h4v-8h3l1-4h-4V8.500c0-.3.2-.5.5-.5z"/></svg>';
const IGIC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.500" cy="6.500" r=".8" fill="currentColor"/></svg>';

function applyLang(){
  document.documentElement.lang=lang; document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  try{localStorage.setItem('tc_lang',lang)}catch(e){}
  $$('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  $$('[data-iph]').forEach(e=>e.placeholder=t(e.dataset.iph));
  $$('[data-l]').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
  $$('[data-map]').forEach(a=>a.href=MAPS);
  $$('.waic').forEach(s=>s.innerHTML='<path d="'+WA_PATH+'"/>');
  $$('.follow').forEach(f=>f.innerHTML=`<b>${t('follow')}</b><div class="row"><a class="btn" target="_blank" rel="noopener" href="${FACEBOOK_URL}">${FBIC}<span>${t('fb')}</span></a><a class="btn" target="_blank" rel="noopener" href="${INSTAGRAM_URL}">${IGIC}<span>${t('ig')}</span></a></div>`);
  renderCats();renderMenu();renderFaq();renderTiles();renderReviews();
}
function renderTiles(){
  $('#tiles').innerHTML=CATS.map(c=>`<div class="tile" role="button" tabindex="0" data-tile="${c.id}">${L(c)}<small>${ITEMS.filter(i=>i.c===c.id).length} ${t('items')}</small></div>`).join('');
}
document.addEventListener('click',e=>{const x=e.target.closest('[data-tile]');if(x){cat=x.dataset.tile;go('menu');renderCats();renderMenu();}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.tile){e.preventDefault();e.target.click();}});

function renderFaq(){
  const mk=f=>`<div class="q"><button type="button" aria-expanded="false"><span>${L(f.q)}</span><svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button><div class="a">${L(f.a)}</div></div>`;
  $('#faqPrev').innerHTML=FAQ.slice(0,3).map(mk).join('');
  $('#faqAll').innerHTML=FAQ.map(mk).join('');
}
document.addEventListener('click',e=>{const b=e.target.closest('.q button');if(b){const p=b.parentElement;p.classList.toggle('on');b.setAttribute('aria-expanded',p.classList.contains('on'));}});

function renderCats(){
  $('#cats').innerHTML=[{id:'all'},...CATS].map(c=>`<button class="cat${c.id===cat?' on':''}" data-c="${c.id}">${c.id==='all'?t('all'):L(c)}</button>`).join('');
}
function chips(it){
  if(it.p.range)return `<span class="chip"><small>${t('from')}</small><b>${num(it.p.range[0])}</b><small>${t('to')}</small><b>${num(it.p.range[1])}</b><small>${t('egp')}</small></span>`;
  return it.p.list.map(x=>`<span class="chip">${x.la?`<small>${lang==='ar'?x.la:x.le}</small>`:''}<b>${num(x.v)}</b><small>${t('egp')}</small></span>`).join('');
}
function card(it){return `<div class="card item"><h3>${L(it)}</h3><div class="chips">${chips(it)}</div></div>`;}
function renderMenu(){
  const qq=q.trim().toLowerCase();
  const match=it=>!qq||(it.ar+' '+it.en).toLowerCase().includes(qq);
  let html='';
  CATS.forEach(c=>{
    if(cat!=='all'&&cat!==c.id)return;
    const its=ITEMS.filter(i=>i.c===c.id&&match(i));
    if(!its.length)return;
    if(cat==='all'||qq)html+=`<div class="gh">${L(c)}</div>`;
    html+=its.map(card).join('');
  });
  $('#menuList').innerHTML=html||`<div class="empty" style="grid-column:1/-1">${t('noRes')}</div>`;
}
$('#search').addEventListener('input',e=>{q=e.target.value;renderMenu();});

/* شريط التصنيفات: لمس + ماوس (سحب وعجلة) */
const cats=$('#cats');let dn=false,sx=0,ss=0,mv=false;
cats.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){dn=true;mv=false;sx=e.clientX;ss=cats.scrollLeft;}});
window.addEventListener('pointermove',e=>{if(!dn)return;const d=e.clientX-sx;if(Math.abs(d)>4){mv=true;cats.classList.add('drag');}cats.scrollLeft=ss-d;});
window.addEventListener('pointerup',()=>{dn=false;cats.classList.remove('drag');});
cats.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){cats.scrollLeft+=e.deltaY;e.preventDefault();}},{passive:false});
cats.addEventListener('click',e=>{
  if(mv){mv=false;return;}
  const b=e.target.closest('.cat');if(!b)return;
  cat=b.dataset.c;renderCats();renderMenu();
  const on=cats.querySelector('.on');if(on)on.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
});

function go(name,scrollId){
  $$('.screen').forEach(s=>s.classList.toggle('on',s.id==='s-'+name));
  $$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.go===name));
  $('#app').scrollTop=0;
  if(scrollId)setTimeout(()=>{const el=document.getElementById(scrollId);if(el)el.scrollIntoView({behavior:'smooth'});},80);
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go,b.dataset.scroll);});

$('#langBtn').addEventListener('click',()=>{lang=lang==='ar'?'en':'ar';applyLang();});
document.addEventListener('click',e=>{const b=e.target.closest('[data-l]');if(b){lang=b.dataset.l;applyLang();}});

const now=new Date();now.setMinutes(now.getMinutes()-now.getTimezoneOffset());
$('#date').min=now.toISOString().slice(0,10);
$('#form').addEventListener('submit',e=>{
  e.preventDefault();
  const v={name:$('#name').value.trim(),phone:$('#phone').value.trim(),date:$('#date').value,time:$('#time').value,guests:$('#guests').value.trim(),notes:$('#notes').value.trim()};
  const g=+v.guests;
  const ok={name:v.name.length>=3,phone:/^\+?[0-9\s-]{8,15}$/.test(v.phone),date:!!v.date&&v.date>=$('#date').min,time:!!v.time,guests:Number.isInteger(g)&&g>=1&&g<=50};
  Object.keys(ok).forEach(k=>$('#f-'+k).classList.toggle('bad',!ok[k]));
  if(Object.values(ok).includes(false)){const f=$('.f.bad');if(f)f.scrollIntoView({behavior:'smooth',block:'center'});return;}
  window.open('https://wa.me/'+WA_NUMBER+'?text='+encodeURIComponent(T[lang].msg(v)),'_blank','noopener');
});

applyLang();
setTimeout(()=>{const s=$('#splash');s.classList.add('hide');setTimeout(()=>s.remove(),700);},3000);
</script>
</body>
</html>
